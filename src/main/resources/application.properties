# Quarkus Configuration for Javabot Web Application

# Application settings
quarkus.application.name=javabot

# javabot.Javabot.main() hands the process off to Quarkus.run(); Quarkus boots the web layer
# and fires the StartupEvent that connects the IRC bot (see JavabotApplication.onStart).
quarkus.package.main-class=javabot.Javabot

# As of the 2026-09-20-remove-guice migration, the domain layer (IRC bot, DAOs, operations,
# commands, services, config/Mongo wiring) is fully CDI-managed -- Guice is gone entirely, so
# no javabot.** type needs excluding from CDI discovery anymore.

# HTTP settings
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Enable/disable web app
javabot.web.enabled=true

# Static resources: webjars ship their content under META-INF/resources/webjars/** already;
# our own assets/ (src/main/resources/META-INF/resources/assets) follows the same convention.
# Quarkus serves anything under META-INF/resources/** automatically, no config needed.

# Qute template configuration
quarkus.qute.suffixes=html

# OIDC (admin authentication). Quarkus OIDC in web-app mode owns the entire OAuth2/OIDC
# redirect-to-provider and callback flow, and establishes the authenticated session using
# quarkus.http.auth.session.encryption-key below -- there is no hand-rolled login endpoint.
# Configure a real provider's client credentials via env vars in prod (no committed defaults,
# so startup fails closed if they're missing); %dev/%test disable the tenant so local dev and
# the test suite don't need a live identity provider.
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.redirect-path=/admin

# /admin/* is the only authenticated surface; hitting it unauthenticated triggers the
# OIDC redirect automatically, so the resource methods only ever see an authenticated caller.
quarkus.http.auth.permission.admin.paths=/admin/*
quarkus.http.auth.permission.admin.policy=authenticated

# Logging (console logging is on by default)
quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Session configuration
# Session cookie encryption key (min 16 chars) - must be supplied via the
# SESSION_ENCRYPTION_KEY environment variable in prod/test; there is no
# committed default so startup fails closed if it's missing.
quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY}

# Development mode settings
%dev.quarkus.http.port=8080
%dev.quarkus.log.level=DEBUG
%dev.quarkus.http.auth.session.encryption-key=dev-only-encryption-key-not-for-prod
%test.quarkus.http.auth.session.encryption-key=test-only-encryption-key-not-for-prod

# No live identity provider in dev/test: disable the OIDC tenant entirely. /admin/* is
# consequently unreachable-as-authenticated in those profiles, which is fine -- the view
# tests exercise TemplateService directly rather than over HTTP.
%dev.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.tenant-enabled=false
