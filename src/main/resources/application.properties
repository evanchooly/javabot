# Quarkus Configuration for Javabot Web Application

# Application settings
quarkus.application.name=javabot

# javabot.Javabot.main() hands the process off to Quarkus.run(); Quarkus boots the web layer
# and fires the StartupEvent that connects the IRC bot (see JavabotApplication.onStart).
quarkus.package.main-class=javabot.Javabot

# The domain layer (IRC bot, DAOs, operations, commands, services) is Guice-managed -- see
# GuiceInjectorProducer. Its classes use jakarta.inject.Inject/Singleton (so Guice 7 and
# Quarkus's own annotation-usage checks agree on one namespace), which would otherwise make
# Arc try to manage them as CDI beans too and fail, since their dependencies (Datastore,
# MongoClient, PircBotX, ...) have no CDI bean definitions. Only javabot.web.** is meant to
# be CDI-managed.
quarkus.arc.exclude-types=javabot.*,javabot.commands.**,javabot.dao.**,javabot.database.**,javabot.javadoc.**,javabot.json.**,javabot.model.**,javabot.operations.**,javabot.service.**

# HTTP settings
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Enable/disable web app
javabot.web.enabled=true

# Static resources: webjars ship their content under META-INF/resources/webjars/** already;
# our own assets/ (src/main/resources/META-INF/resources/assets) follows the same convention.
# Quarkus serves anything under META-INF/resources/** automatically, no config needed.

# Qute template configuration
quarkus.qute.suffixes=html

# OAuth Configuration (to be populated from javabot.yml if needed)
# quarkus.oidc.enabled=false

# Logging (console logging is on by default)
quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Session configuration
# Session cookie encryption key (min 16 chars) - must be supplied via the
# SESSION_ENCRYPTION_KEY environment variable in prod/test; there is no
# committed default so startup fails closed if it's missing.
quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY}

# Development mode settings
%dev.quarkus.http.port=8080
%dev.quarkus.log.level=DEBUG
%dev.quarkus.http.auth.session.encryption-key=dev-only-encryption-key-not-for-prod
%test.quarkus.http.auth.session.encryption-key=test-only-encryption-key-not-for-prod
