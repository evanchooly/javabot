# --- Quarkus OIDC (admin login) ---
# These are NOT read from this file: Quarkus reads them from application.properties, which
# in turn expands them from environment variables. They are listed here for reference so a
# deployer can see everything that must be configured in one place. Export them (or put them
# in your deployment's env/secret store) before starting the bot in prod:
#   OIDC_AUTH_SERVER_URL=https://accounts.google.com
#   OIDC_CLIENT_ID=your-client-id.apps.googleusercontent.com
#   OIDC_CLIENT_SECRET=your-client-secret
#   SESSION_ENCRYPTION_KEY=at-least-16-characters-of-random-secret
